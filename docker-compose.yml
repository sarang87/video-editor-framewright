services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - VLLM_BASE_URL=http://vllm:8000/v1
    volumes:
      - ./:/app
      - /mnt/d/Italy/Videos/CLIP:/videos_source:ro

  vllm:
    build:
      context: ./vllm
    ports:
      - "8000:8000"
    environment:
      - VLLM_USE_V1=0
      - LOG_DIR=/opt/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    volumes:
      - ./:/opt/project_root:ro
      - ./vllm:/opt/app
      - ./hf_cache:/root/.cache/huggingface
      - ./videos/proxies:/opt/app/videos/proxies:ro
      - ./logs:/opt/logs
    ipc: host
    command: python start_server.py
    stdin_open: true
    tty: true
