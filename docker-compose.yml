services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm:8000/v1}
      - MODEL_NAME=${MODEL_NAME:-Qwen/Qwen3-VL-8B-Instruct-FP8}
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-8192}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      vllm:
        condition: service_healthy
    volumes:
      - ./:/app
      - /mnt/d:/videos_source:ro

  vllm:
    build:
      context: ./vllm
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
    environment:
      - VLLM_USE_V1=0
      - LOG_DIR=/opt/logs
      - MODEL_NAME=${MODEL_NAME:-Qwen/Qwen3-VL-8B-Instruct-FP8}
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-8192}
      - GPU_MEMORY_UTILIZATION=${GPU_MEMORY_UTILIZATION:-0.85}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    volumes:
      - ./:/opt/project_root:ro
      - ./vllm:/opt/app
      - ./hf_cache:/root/.cache/huggingface
      - ./videos/proxies:/opt/app/videos/proxies:ro
      - ./logs:/opt/logs
    ipc: host
    command: python start_server.py
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stdin_open: true
    tty: true
